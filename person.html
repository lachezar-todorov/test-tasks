<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Моите задачи</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div class="person-header">
    <img class="site-logo" src="logo.svg" alt="" onerror="this.style.display='none'">
  </div>
  <div class="card person" style="max-width:520px;margin:8px auto 0;">
    <h2 id="nameHeader">Задачи</h2>
    <p class="sub-note">Списъкът се обновява автоматично. Най-новите задачи са отгоре.</p>
    <div class="propose-row">
      <input type="text" id="newTaskText" placeholder="Предложи си задача...">
      <button class="btn-primary" id="addBtn">Добави</button>
    </div>
    <div id="list"><div class="empty">Зареждане...</div></div>
  </div>

  <div class="card person pending-card" style="max-width:520px;margin:20px auto 0;">
    <h2>Непотвърдени задачи</h2>
    <p class="sub-note">Тези задачи си ги предложил сам — чакат одобрение от администраторския панел.</p>
    <div id="pendingList"><div class="empty">Зареждане...</div></div>
  </div>

  <script src="config.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const u = params.get('u');
    const openComments = new Set();
    const commentDrafts = {};
    let editingCommentId = null;
    let tasksData = [];
    let pendingData = [];
    let myName = '';

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function commentsHtml(t) {
      const open = openComments.has(t.id);
      const list = (t.comments || []).map(function (c) {
        const cls = c.author === 'Админ' ? 'comment comment-admin' : 'comment comment-person';
        const canEdit = c.author === myName;
        let body;
        if (c.id === editingCommentId) {
          body = '<div class="comment-edit-row"><input type="text" class="comment-edit-text" value="' + esc(c.text) + '">' +
            '<button class="btn-primary comment-edit-save" data-comment="' + esc(c.id) + '">Запази</button>' +
            '<button class="btn-ghost comment-edit-cancel" data-comment="' + esc(c.id) + '">Отказ</button></div>';
        } else {
          body = '<div class="comment-text"><span class="comment-text-value">' + esc(c.text) + '</span>' +
            (canEdit ? '<button class="comment-edit-btn" data-comment="' + esc(c.id) + '" title="Редактирай">✎</button>' : '') +
            '</div>';
        }
        return '<div class="' + cls + '"><b>' + esc(c.author) + '</b><span class="comment-date">' + esc(c.date) + '</span>' + body + '</div>';
      }).join('');
      const draft = commentDrafts[t.id] || '';
      return '<div class="comments" id="comments-' + esc(t.id) + '" style="display:' + (open ? 'block' : 'none') + '">' +
        '<div class="comment-list">' + (list || '<div class="comment-empty">Няма коментари.</div>') + '</div>' +
        '<div class="comment-add">' +
          '<input type="text" class="comment-input" data-task="' + esc(t.id) + '" placeholder="Коментар..." value="' + esc(draft) + '">' +
          '<button class="btn-ghost comment-send" data-task="' + esc(t.id) + '">Изпрати</button>' +
        '</div>' +
      '</div>';
    }

    function commentToggleBtn(t) {
      const n = (t.comments || []).length;
      return '<button class="btn-ghost comment-toggle" data-toggle="' + esc(t.id) + '">💬 ' + n + '</button>';
    }

    function renderList(elId, rows, emptyMsg) {
      const el = document.getElementById(elId);
      if (!rows || !rows.length) {
        el.innerHTML = '<div class="empty">' + emptyMsg + '</div>';
        return;
      }
      el.innerHTML = '<ul class="tasks">' + rows.map(function (t) {
        return '<li data-id="' + esc(t.id) + '"><div class="task-row">' +
          '<span class="task-text">' + esc(t.text) + '</span>' +
          commentToggleBtn(t) +
          '</div>' + commentsHtml(t) + '</li>';
      }).join('') + '</ul>';
      attachCommentHandlers(el);
    }

    function attachCommentHandlers(scope) {
      scope.querySelectorAll('[data-toggle]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const id = btn.getAttribute('data-toggle');
          if (openComments.has(id)) openComments.delete(id); else openComments.add(id);
          render(tasksData, pendingData, document.getElementById('nameHeader').textContent);
        });
      });
      scope.querySelectorAll('.comment-input').forEach(function (input) {
        input.addEventListener('input', function () {
          commentDrafts[input.getAttribute('data-task')] = input.value;
        });
      });
      scope.querySelectorAll('.comment-send').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const id = btn.getAttribute('data-task');
          const input = scope.querySelector('.comment-input[data-task="' + CSS.escape(id) + '"]');
          const text = input.value.trim();
          if (!text) return;
          addComment(id, text);
        });
      });
      scope.querySelectorAll('.comment-edit-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          editingCommentId = btn.getAttribute('data-comment');
          render(tasksData, pendingData, document.getElementById('nameHeader').textContent);
        });
      });
      scope.querySelectorAll('.comment-edit-cancel').forEach(function (btn) {
        btn.addEventListener('click', function () {
          editingCommentId = null;
          render(tasksData, pendingData, document.getElementById('nameHeader').textContent);
        });
      });
      scope.querySelectorAll('.comment-edit-save').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const wrap = btn.closest('.comment-edit-row');
          const text = wrap.querySelector('.comment-edit-text').value.trim();
          if (!text) return;
          editComment(btn.getAttribute('data-comment'), text);
        });
      });
    }

    function render(rows, pending, name) {
      if (name) { document.getElementById('nameHeader').textContent = name; myName = name; }
      renderList('list', rows, 'Нямаш активни задачи в момента.');
      renderList('pendingList', pending, 'Нямаш непотвърдени задачи в момента.');
    }

    async function refresh() {
      if (!u) {
        document.getElementById('list').innerHTML = '<div class="empty">Липсва личен код в адреса.</div>';
        document.getElementById('pendingList').innerHTML = '';
        return;
      }
      try {
        const res = await fetch(API_URL + '?action=tasks&u=' + encodeURIComponent(u));
        const data = await res.json();
        if (data.ok === false) {
          document.getElementById('list').innerHTML = '<div class="empty">' + esc(data.error || 'Грешка.') + '</div>';
          document.getElementById('pendingList').innerHTML = '';
          return;
        }
        tasksData = data.tasks || [];
        pendingData = data.pendingTasks || [];
        render(tasksData, pendingData, data.name);
      } catch (err) {
        document.getElementById('list').innerHTML = '<div class="empty">Грешка при връзка със сървъра.</div>';
      }
    }

    async function addTask() {
      const text = document.getElementById('newTaskText').value.trim();
      if (!text || !u) return;
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'personAddTask', u: u, text: text })
        });
        const data = await res.json();
        if (data.ok === false) { alert('Грешка: ' + data.error); return; }
        tasksData = data.tasks || [];
        pendingData = data.pendingTasks || [];
        render(tasksData, pendingData, data.name);
        document.getElementById('newTaskText').value = '';
      } catch (err) {
        alert('Грешка при връзка със сървъра.');
      }
    }

    async function addComment(taskId, text) {
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'addComment', u: u, taskId: taskId, text: text })
        });
        const data = await res.json();
        if (data.ok === false) { alert('Грешка: ' + data.error); return; }
        delete commentDrafts[taskId];
        openComments.add(taskId);
        tasksData = data.tasks || [];
        pendingData = data.pendingTasks || [];
        render(tasksData, pendingData, data.name);
      } catch (err) {
        alert('Грешка при връзка със сървъра.');
      }
    }

    async function editComment(commentId, text) {
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'editComment', u: u, commentId: commentId, text: text })
        });
        const data = await res.json();
        if (data.ok === false) { alert('Грешка: ' + data.error); return; }
        editingCommentId = null;
        tasksData = data.tasks || [];
        pendingData = data.pendingTasks || [];
        render(tasksData, pendingData, data.name);
      } catch (err) {
        alert('Грешка при връзка със сървъра.');
      }
    }

    document.getElementById('addBtn').addEventListener('click', addTask);
    refresh();
    setInterval(function () { if (!editingCommentId) refresh(); }, 15000);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && !editingCommentId) refresh();
    });
  </script>
</body>
</html>
