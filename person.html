<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Моите задачи</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div class="person-header">
    <img class="site-logo" src="logo.svg" alt="" onerror="this.style.display='none'">
  </div>
  <div class="card person" style="max-width:520px;margin:8px auto 0;">
    <h2 id="nameHeader">Задачи</h2>
    <p class="sub-note">Списъкът се обновява автоматично. Най-новите задачи са отгоре.</p>
    <div class="propose-row">
      <input type="text" id="newTaskText" placeholder="Предложи си задача...">
      <select id="newTaskProject"></select>
      <label class="important-check"><input type="checkbox" id="newTaskImportant"> Важна</label>
      <button class="btn-primary" id="addBtn">Добави</button>
    </div>
    <div id="list"><div class="empty">Зареждане...</div></div>
  </div>

  <div class="card person pending-card" style="max-width:520px;margin:20px auto 0;">
    <h2>Непотвърдени задачи</h2>
    <p class="sub-note">Тези задачи си ги предложил сам — чакат одобрение от администраторския панел.</p>
    <div id="pendingList"><div class="empty">Зареждане...</div></div>
  </div>

  <script src="config.js"></script>
  <script>
    const PROJECTS = [
      'Холидей парк, гр. Русе',
      'Дом за възрастни хора, гр. Момин проход',
      'Холидей парк, Симеоново',
      'Алумакс',
      'Биотрейд',
      'Белисимо',
      'Ресторант Шамот',
      'Здравко Здравков',
      'Технополис, гр. Монтана',
      'Младен, с. Лозен'
    ];

    const params = new URLSearchParams(location.search);
    const u = params.get('u');
    const openComments = new Set();
    const commentDrafts = {};
    let editingCommentId = null;
    let tasksData = [];
    let pendingData = [];
    let myName = '';
    let lastSnapshot = null;

    // Две отделни нива на "прочетено": ниво коментар (маркира се само с клик
    // direktно върху него) и ниво задача (само "новото" на задачата — маха се
    // щом отвориш панела, но automatически се връща, ако дойде нов/редактиран
    // коментар, защото се пази заедно с "отпечатък" на текущите коментари).
    const SEEN_COMMENTS_KEY = 'seenComments_' + (u || 'unknown');
    const SEEN_TASKS_KEY = 'seenTasks_' + (u || 'unknown');
    let seenComments, seenTasks;
    try { seenComments = new Set(JSON.parse(localStorage.getItem(SEEN_COMMENTS_KEY) || '[]')); }
    catch (e) { seenComments = new Set(); }
    try { seenTasks = JSON.parse(localStorage.getItem(SEEN_TASKS_KEY) || '{}'); }
    catch (e) { seenTasks = {}; }
    function saveSeenComments() { localStorage.setItem(SEEN_COMMENTS_KEY, JSON.stringify(Array.from(seenComments))); }
    function saveSeenTasks() { localStorage.setItem(SEEN_TASKS_KEY, JSON.stringify(seenTasks)); }
    function isUnread(c) { return c.author !== myName && !seenComments.has(c.id); }
    function taskSignature(t) { return (t.comments || []).map(function (c) { return c.id + ':' + c.date; }).join('|'); }
    function isTaskUnread(t) {
      const neverOpened = !(t.id in seenTasks);
      const hasNewComments = (t.comments || []).some(isUnread) && seenTasks[t.id] !== taskSignature(t);
      return neverOpened || hasNewComments;
    }
    function markTaskOpened(t) {
      seenTasks[t.id] = taskSignature(t);
      saveSeenTasks();
    }
    function markCommentSeen(id) {
      seenComments.add(id);
      saveSeenComments();
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function commentsHtml(t) {
      const open = openComments.has(t.id);
      const list = (t.comments || []).map(function (c) {
        const unread = isUnread(c);
        const canEdit = c.author === myName;
        const cls = 'comment ' + (c.author === 'Админ' ? 'comment-admin' : 'comment-person') + (unread ? ' comment-unread' : '');
        let body;
        if (c.id === editingCommentId) {
          body = '<div class="comment-edit-row"><input type="text" class="comment-edit-text" value="' + esc(c.text) + '">' +
            '<button class="btn-primary comment-edit-save" data-comment="' + esc(c.id) + '">Запази</button>' +
            '<button class="btn-ghost comment-edit-cancel" data-comment="' + esc(c.id) + '">Отказ</button></div>';
        } else {
          body = '<div class="comment-text"><span class="comment-text-value">' + esc(c.text) + '</span>' +
            (canEdit ? '<div class="comment-actions">' +
              '<button class="comment-edit-btn" data-comment="' + esc(c.id) + '" title="Редактирай">✎</button>' +
              '<button class="comment-delete-btn" data-comment="' + esc(c.id) + '" title="Изтрий">🗑</button>' +
            '</div>' : '') +
            '</div>';
        }
        return '<div class="' + cls + '" data-comment-id="' + esc(c.id) + '" title="' + (unread ? 'Кликни за прочетено' : '') + '">' +
          '<b>' + esc(c.author) + '</b><span class="comment-date">' + esc(c.date) + '</span>' +
          (unread ? '<span class="comment-unread-badge">Ново</span>' : '') + body + '</div>';
      }).join('');
      const draft = commentDrafts[t.id] || '';
      return '<div class="comments" id="comments-' + esc(t.id) + '" style="display:' + (open ? 'block' : 'none') + '">' +
        '<div class="comment-list">' + (list || '<div class="comment-empty">Няма коментари.</div>') + '</div>' +
        '<div class="comment-add">' +
          '<input type="text" class="comment-input" data-task="' + esc(t.id) + '" placeholder="Коментар..." value="' + esc(draft) + '">' +
          '<button class="btn-ghost comment-send" data-task="' + esc(t.id) + '">Изпрати</button>' +
        '</div>' +
      '</div>';
    }

    function commentToggleBtn(t) {
      const n = (t.comments || []).length;
      const unread = (t.comments || []).some(isUnread);
      return '<button class="btn-ghost comment-toggle' + (unread ? ' comment-toggle-unread' : '') + '" data-toggle="' + esc(t.id) + '">💬 ' + n + '</button>';
    }

    function projectOptions() {
      return '<option value="">— без проект —</option>' + PROJECTS.map(function (p) {
        return '<option value="' + esc(p) + '">' + esc(p) + '</option>';
      }).join('');
    }

    function projectBadge(t) {
      return t.project ? '<span class="badge-project">' + esc(t.project) + '</span>' : '';
    }

    function taskTextHtml(t) {
      const unread = isTaskUnread(t);
      return '<span class="task-text' + (unread ? ' task-text-unread' : '') + '">' +
        (unread ? '<span class="unread-dot"></span>' : '') + esc(t.text) + '</span>';
    }

    // Отделен бутон само за да маркираш САМАТА задача като видяна, без да
    // отваряш панела с коментари (тях ги маркираш поотделно, с клик върху всеки).
    function markReadBtnHtml(t) {
      if (!isTaskUnread(t)) return '';
      return '<button class="btn-ghost mark-read-btn" data-mark-read="' + esc(t.id) + '" title="Маркирай задачата като прочетена">✓ Прочетено</button>';
    }

    function renderList(elId, rows, emptyMsg) {
      const el = document.getElementById(elId);
      if (!rows || !rows.length) {
        el.innerHTML = '<div class="empty">' + emptyMsg + '</div>';
        return;
      }
      el.innerHTML = '<ul class="tasks">' + rows.map(function (t) {
        return '<li class="' + (t.important ? 'important-row' : '') + '" data-id="' + esc(t.id) + '"><div class="task-row">' +
          (t.important ? '<span class="badge-important">Важна</span>' : '') +
          projectBadge(t) +
          taskTextHtml(t) +
          markReadBtnHtml(t) +
          commentToggleBtn(t) +
          '</div>' + commentsHtml(t) + '</li>';
      }).join('') + '</ul>';
      attachCommentHandlers(el);
    }

    function attachCommentHandlers(scope) {
      scope.querySelectorAll('[data-toggle]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const id = btn.getAttribute('data-toggle');
          if (openComments.has(id)) {
            openComments.delete(id);
          } else {
            openComments.add(id);
            const t = tasksData.concat(pendingData).find(function (x) { return x.id === id; });
            if (t) markTaskOpened(t);
          }
          render(tasksData, pendingData, document.getElementById('nameHeader').textContent);
        });
      });
      scope.querySelectorAll('[data-mark-read]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const id = btn.getAttribute('data-mark-read');
          const t = tasksData.concat(pendingData).find(function (x) { return x.id === id; });
          if (t) markTaskOpened(t);
          render(tasksData, pendingData, document.getElementById('nameHeader').textContent);
        });
      });
      scope.querySelectorAll('.comment[data-comment-id]').forEach(function (el) {
        el.addEventListener('click', function (e) {
          if (e.target.closest('button, input')) return;
          markCommentSeen(el.getAttribute('data-comment-id'));
          render(tasksData, pendingData, document.getElementById('nameHeader').textContent);
        });
      });
      scope.querySelectorAll('.comment-input').forEach(function (input) {
        input.addEventListener('input', function () {
          commentDrafts[input.getAttribute('data-task')] = input.value;
        });
      });
      scope.querySelectorAll('.comment-send').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          const id = btn.getAttribute('data-task');
          const input = scope.querySelector('.comment-input[data-task="' + CSS.escape(id) + '"]');
          const text = input.value.trim();
          if (!text) return;
          btn.disabled = true;
          btn.textContent = 'Изпраща се...';
          input.disabled = true;
          await addComment(id, text);
          if (document.body.contains(btn)) {
            btn.disabled = false;
            btn.textContent = 'Изпрати';
            input.disabled = false;
          }
        });
      });
      scope.querySelectorAll('.comment-edit-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          editingCommentId = btn.getAttribute('data-comment');
          markCommentSeen(editingCommentId);
          render(tasksData, pendingData, document.getElementById('nameHeader').textContent);
        });
      });
      scope.querySelectorAll('.comment-edit-cancel').forEach(function (btn) {
        btn.addEventListener('click', function () {
          editingCommentId = null;
          render(tasksData, pendingData, document.getElementById('nameHeader').textContent);
        });
      });
      scope.querySelectorAll('.comment-edit-save').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const wrap = btn.closest('.comment-edit-row');
          const text = wrap.querySelector('.comment-edit-text').value.trim();
          if (!text) return;
          editComment(btn.getAttribute('data-comment'), text);
        });
      });
      scope.querySelectorAll('.comment-delete-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!confirm('Да изтрия ли този коментар?')) return;
          deleteComment(btn.getAttribute('data-comment'));
        });
      });
    }

    function render(rows, pending, name) {
      if (name) { document.getElementById('nameHeader').textContent = name; myName = name; }
      // важните задачи излизат отгоре, независимо от реда по активност
      const sorted = (rows || []).slice().sort(function (a, b) { return (b.important ? 1 : 0) - (a.important ? 1 : 0); });
      renderList('list', sorted, 'Нямаш активни задачи в момента.');
      renderList('pendingList', pending, 'Нямаш непотвърдени задачи в момента.');
    }

    // Прилага нов отговор от сървъра. Използвай това (вместо direktно
    // задаване на tasksData/pendingData + render()) при всяко действие,
    // за да остане "тихият" refresh() в синхрон.
    function applyData(payload) {
      tasksData = payload.tasks || [];
      pendingData = payload.pendingTasks || [];
      lastSnapshot = JSON.stringify({ t: tasksData, p: pendingData });
      render(tasksData, pendingData, payload.name);
    }

    async function refresh() {
      if (!u) {
        document.getElementById('list').innerHTML = '<div class="empty">Липсва личен код в адреса.</div>';
        document.getElementById('pendingList').innerHTML = '';
        return;
      }
      try {
        const res = await fetch(API_URL + '?action=tasks&u=' + encodeURIComponent(u));
        const data = await res.json();
        if (data.ok === false) {
          document.getElementById('list').innerHTML = '<div class="empty">' + esc(data.error || 'Грешка.') + '</div>';
          document.getElementById('pendingList').innerHTML = '';
          return;
        }
        const snapshot = JSON.stringify({ t: data.tasks || [], p: data.pendingTasks || [] });
        if (snapshot === lastSnapshot) return; // нищо ново — не пипаме екрана (за да не скача курсорът в коментар/поле)
        applyData(data);
      } catch (err) {
        document.getElementById('list').innerHTML = '<div class="empty">Грешка при връзка със сървъра.</div>';
      }
    }

    async function addTask() {
      const text = document.getElementById('newTaskText').value.trim();
      if (!text || !u) return;
      const important = document.getElementById('newTaskImportant').checked;
      const project = document.getElementById('newTaskProject').value;
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'personAddTask', u: u, text: text, important: important, project: project })
        });
        const data = await res.json();
        if (data.ok === false) { alert('Грешка: ' + data.error); return; }
        const created = (data.pendingTasks || []).find(function (t) { return t.text === text; });
        if (created) markTaskOpened(created);
        applyData(data);
        document.getElementById('newTaskText').value = '';
        document.getElementById('newTaskImportant').checked = false;
        document.getElementById('newTaskProject').value = '';
      } catch (err) {
        alert('Грешка при връзка със сървъра.');
      }
    }

    async function addComment(taskId, text) {
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'addComment', u: u, taskId: taskId, text: text })
        });
        const data = await res.json();
        if (data.ok === false) { alert('Грешка: ' + data.error); return; }
        delete commentDrafts[taskId];
        openComments.add(taskId);
        applyData(data);
      } catch (err) {
        alert('Грешка при връзка със сървъра.');
      }
    }

    async function editComment(commentId, text) {
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'editComment', u: u, commentId: commentId, text: text })
        });
        const data = await res.json();
        if (data.ok === false) { alert('Грешка: ' + data.error); return; }
        editingCommentId = null;
        applyData(data);
      } catch (err) {
        alert('Грешка при връзка със сървъра.');
      }
    }

    async function deleteComment(commentId) {
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'deleteComment', u: u, commentId: commentId })
        });
        const data = await res.json();
        if (data.ok === false) { alert('Грешка: ' + data.error); return; }
        applyData(data);
      } catch (err) {
        alert('Грешка при връзка със сървъра.');
      }
    }

    document.getElementById('newTaskProject').innerHTML = projectOptions();
    document.getElementById('addBtn').addEventListener('click', async function () {
      const btn = document.getElementById('addBtn');
      const input = document.getElementById('newTaskText');
      const importantCb = document.getElementById('newTaskImportant');
      const projectSelect = document.getElementById('newTaskProject');
      btn.disabled = true;
      btn.textContent = 'Добавя се...';
      input.disabled = true;
      importantCb.disabled = true;
      projectSelect.disabled = true;
      await addTask();
      btn.disabled = false;
      btn.textContent = 'Добави';
      input.disabled = false;
      importantCb.disabled = false;
      projectSelect.disabled = false;
    });
    refresh();
    setInterval(function () { if (!editingCommentId) refresh(); }, 15000);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && !editingCommentId) refresh();
    });
  </script>
</body>
</html>
