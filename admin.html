<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Основен панел</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">Табло • Задачи <span id="todayLabel"></span></div>
  <div class="wrap">
    <div class="card">
      <div class="board-tabs" id="boardTabs"></div>
      <h2>Нова задача</h2>
      <div class="addrow">
        <input type="text" id="newTaskText" placeholder="Описание на задачата...">
        <select id="newTaskWho"></select>
        <button class="btn-primary" id="addBtn">Добави</button>
      </div>
    </div>
    <div class="card pending-card" id="approvalCard"></div>
    <div class="card" id="activeCard"></div>
    <div class="card" id="doneCard"></div>
    <div class="card">
      <h2>Лични линкове — изпрати на всеки</h2>
      <ul class="links" id="linksList"></ul>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const pin = sessionStorage.getItem('pin');
    if (!pin) { location.href = 'index.html'; }

    let boardsMeta = {};
    let currentBoard = sessionStorage.getItem('board') || 'main';
    let data = [];
    let editingId = null;
    const openComments = new Set();

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function currentPeople() {
      return (boardsMeta[currentBoard] && boardsMeta[currentBoard].people) || {};
    }

    async function apiGet(action, extraParams) {
      const params = new URLSearchParams(Object.assign({ action: action, pin: pin, board: currentBoard }, extraParams || {}));
      const res = await fetch(API_URL + '?' + params.toString());
      return res.json();
    }

    // ВАЖНО: без header "Content-Type: application/json" — иначе браузърът
    // праща CORS preflight (OPTIONS), който Apps Script не поддържа.
    async function apiPost(action, extra) {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify(Object.assign({ action: action, pin: pin, board: currentBoard }, extra || {}))
      });
      return res.json();
    }

    function onError(err) {
      console.error('Server error:', err);
      alert('Грешка от сървъра: ' + (err && err.message ? err.message : err));
    }

    function peopleOptions(selected) {
      return Object.values(currentPeople()).map(function (n) {
        return '<option value="' + esc(n) + '"' + (n === selected ? ' selected' : '') + '>' + esc(n) + '</option>';
      }).join('');
    }

    function commentsHtml(t) {
      const open = openComments.has(t.id);
      const list = (t.comments || []).map(function (c) {
        return '<div class="comment"><b>' + esc(c.author) + '</b><span class="comment-date">' + esc(c.date) + '</span>' +
          '<div class="comment-text">' + esc(c.text) + '</div></div>';
      }).join('');
      return '<div class="comments" id="comments-' + esc(t.id) + '" style="display:' + (open ? 'block' : 'none') + '">' +
        '<div class="comment-list">' + (list || '<div class="comment-empty">Няма коментари.</div>') + '</div>' +
        '<div class="comment-add">' +
          '<input type="text" class="comment-input" data-task="' + esc(t.id) + '" placeholder="Коментар...">' +
          '<button class="btn-ghost comment-send" data-task="' + esc(t.id) + '">Изпрати</button>' +
        '</div>' +
      '</div>';
    }

    function commentToggleBtn(t) {
      const n = (t.comments || []).length;
      return '<button class="btn-ghost comment-toggle" data-toggle="' + esc(t.id) + '">💬 ' + n + '</button>';
    }

    function editRowHtml(t) {
      return '<div class="edit-row">' +
        '<input type="text" class="edit-text" value="' + esc(t.text) + '">' +
        '<select class="edit-assignee">' + peopleOptions(t.assignee) + '</select>' +
        '<button class="btn-primary edit-save" data-id="' + esc(t.id) + '">Запази</button>' +
        '<button class="btn-ghost edit-cancel" data-id="' + esc(t.id) + '">Отказ</button>' +
      '</div>';
    }

    function groupByAssignee(rows) {
      const order = [], map = {};
      rows.forEach(function (t) { if (!(t.assignee in map)) { map[t.assignee] = []; order.push(t.assignee); } map[t.assignee].push(t); });
      return { order: order, map: map };
    }

    function renderApproval() {
      const pending = data.filter(function (t) { return t.status === 'Чака одобрение'; });
      let html = '<h2>Чакат одобрение (' + pending.length + ')</h2>';
      if (pending.length) {
        const g = groupByAssignee(pending);
        g.order.forEach(function (name) {
          html += '<div class="group-name">' + esc(name) + ' (' + g.map[name].length + ')</div><ul class="tasks">';
          g.map[name].forEach(function (t) {
            html += '<li data-id="' + esc(t.id) + '"><div class="task-row">' +
              '<span class="badge-pending">чака</span>' +
              '<span class="task-text">' + esc(t.text) + '</span>' +
              commentToggleBtn(t) +
              '<button class="btn-primary" data-approve="' + esc(t.id) + '">Одобри</button>' +
              '<button class="btn-ghost" data-del="' + esc(t.id) + '">Отхвърли</button>' +
              '</div>' + commentsHtml(t) + '</li>';
          });
          html += '</ul>';
        });
      } else {
        html += '<div class="empty">Няма предложени задачи, чакащи одобрение.</div>';
      }
      document.getElementById('approvalCard').innerHTML = html;
    }

    function renderActive() {
      const active = data.filter(function (t) { return t.status === 'Активна'; });
      let html = '<h2>Активни задачи (' + active.length + ')</h2>';
      if (active.length) {
        const g = groupByAssignee(active);
        g.order.forEach(function (name) {
          html += '<div class="group-name">' + esc(name) + ' (' + g.map[name].length + ')</div><ul class="tasks">';
          g.map[name].forEach(function (t) {
            const row = t.id === editingId ? editRowHtml(t) :
              '<input type="checkbox" class="chk" data-id="' + esc(t.id) + '">' +
              '<span class="task-text">' + esc(t.text) + '</span>' +
              commentToggleBtn(t) +
              '<button class="btn-ghost" data-edit="' + esc(t.id) + '">✎</button>' +
              '<button class="btn-ghost" data-del="' + esc(t.id) + '">✕</button>';
            html += '<li data-id="' + esc(t.id) + '"><div class="task-row">' + row + '</div>' + commentsHtml(t) + '</li>';
          });
          html += '</ul>';
        });
      } else {
        html += '<div class="empty">Няма активни задачи.</div>';
      }
      document.getElementById('activeCard').innerHTML = html;
    }

    function renderDone() {
      const done = data.filter(function (t) { return t.status === 'Изпълнена'; });
      let html = '<h2>Изпълнени днес (' + done.length + ')</h2>';
      if (done.length) {
        html += '<ul class="tasks">' + done.map(function (t) {
          return '<li data-id="' + esc(t.id) + '"><div class="task-row">' +
            '<input type="checkbox" class="chk" checked data-id="' + esc(t.id) + '">' +
            '<span class="task-text" style="text-decoration:line-through;color:#8a95a1;">' + esc(t.text) + '</span>' +
            '<span class="task-assignee">' + esc(t.assignee) + '</span>' +
            commentToggleBtn(t) +
            '</div>' + commentsHtml(t) + '</li>';
        }).join('') + '</ul>';
      } else {
        html += '<div class="empty">Все още няма изпълнени задачи.</div>';
      }
      html += '<div class="footer-row"><span class="count">Приключването премества изпълнените в Архив и ги маха от тук — активните остават за утре.</span>' +
        '<button class="btn-export" id="closeDayBtn" ' + (done.length ? '' : 'disabled') + '>Приключи деня</button></div>';
      document.getElementById('doneCard').innerHTML = html;
    }

    function attachHandlers() {
      document.querySelectorAll('.chk').forEach(function (cb) {
        cb.addEventListener('change', function () { toggle(cb.getAttribute('data-id'), cb.checked); });
      });
      document.querySelectorAll('[data-del]').forEach(function (btn) {
        btn.addEventListener('click', function () { del(btn.getAttribute('data-del')); });
      });
      document.querySelectorAll('[data-approve]').forEach(function (btn) {
        btn.addEventListener('click', function () { approve(btn.getAttribute('data-approve')); });
      });
      document.querySelectorAll('[data-edit]').forEach(function (btn) {
        btn.addEventListener('click', function () { editingId = btn.getAttribute('data-edit'); render(); });
      });
      document.querySelectorAll('.edit-cancel').forEach(function (btn) {
        btn.addEventListener('click', function () { editingId = null; render(); });
      });
      document.querySelectorAll('.edit-save').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const li = btn.closest('li');
          const text = li.querySelector('.edit-text').value.trim();
          const assignee = li.querySelector('.edit-assignee').value;
          if (!text) return;
          editTask(btn.getAttribute('data-id'), text, assignee);
        });
      });
      document.querySelectorAll('[data-toggle]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const id = btn.getAttribute('data-toggle');
          if (openComments.has(id)) openComments.delete(id); else openComments.add(id);
          render();
        });
      });
      document.querySelectorAll('.comment-send').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const id = btn.getAttribute('data-task');
          const input = document.querySelector('.comment-input[data-task="' + CSS.escape(id) + '"]');
          const text = input.value.trim();
          if (!text) return;
          addComment(id, text);
        });
      });
      const closeBtn = document.getElementById('closeDayBtn');
      if (closeBtn) closeBtn.addEventListener('click', closeDay);
    }

    function render() {
      if (!Array.isArray(data)) {
        document.getElementById('approvalCard').innerHTML = '';
        document.getElementById('activeCard').innerHTML = '<h2>Активни задачи</h2><div class="empty">Няма данни (виж конзолата за грешка).</div>';
        document.getElementById('doneCard').innerHTML = '';
        return;
      }
      renderApproval();
      renderActive();
      renderDone();
      attachHandlers();
    }

    async function refresh() {
      try {
        const res = await apiGet('tasks');
        if (res.ok === false) { onError({ message: res.error }); return; }
        data = res.tasks || [];
        render();
      } catch (err) { onError(err); }
    }

    async function addTask() {
      const text = document.getElementById('newTaskText').value.trim();
      const who = document.getElementById('newTaskWho').value;
      if (!text) return;
      try {
        const res = await apiPost('addTask', { text: text, assignee: who });
        if (res.ok === false) { onError({ message: res.error }); return; }
        data = res.tasks; render();
        document.getElementById('newTaskText').value = '';
      } catch (err) { onError(err); }
    }

    async function editTask(id, text, assignee) {
      try {
        const res = await apiPost('editTask', { id: id, text: text, assignee: assignee });
        if (res.ok === false) { onError({ message: res.error }); return; }
        editingId = null;
        data = res.tasks; render();
      } catch (err) { onError(err); }
    }

    async function approve(id) {
      try {
        const res = await apiPost('approveTask', { id: id });
        if (res.ok === false) { onError({ message: res.error }); return; }
        data = res.tasks; render();
      } catch (err) { onError(err); }
    }

    async function toggle(id, checked) {
      try {
        const res = await apiPost('toggleTask', { id: id, done: checked });
        if (res.ok === false) { onError({ message: res.error }); return; }
        data = res.tasks; render();
      } catch (err) { onError(err); }
    }

    async function del(id) {
      if (!confirm('Да изтрия ли тази задача?')) return;
      try {
        const res = await apiPost('deleteTask', { id: id });
        if (res.ok === false) { onError({ message: res.error }); return; }
        data = res.tasks; render();
      } catch (err) { onError(err); }
    }

    async function addComment(taskId, text) {
      try {
        const res = await apiPost('addComment', { taskId: taskId, text: text });
        if (res.ok === false) { onError({ message: res.error }); return; }
        openComments.add(taskId);
        data = res.tasks; render();
      } catch (err) { onError(err); }
    }

    async function closeDay() {
      if (!confirm('Изпълнените задачи ще се преместят в Архив и ще изчезнат от активния списък. Продължи?')) return;
      try {
        const res = await apiPost('closeDay', {});
        if (res.ok === false) { onError({ message: res.error }); return; }
        data = res.tasks; render();
      } catch (err) { onError(err); }
    }

    function buildLinks() {
      const base = location.origin + location.pathname.replace('admin.html', '');
      const list = document.getElementById('linksList');
      let html = '';
      Object.keys(boardsMeta).forEach(function (boardKey) {
        const b = boardsMeta[boardKey];
        html += '<li style="border-top:none;padding-bottom:0;"><b>' + esc(b.label) + '</b></li>';
        Object.keys(b.people).forEach(function (slug) {
          const url = base + 'person.html?u=' + slug + (boardKey === 'main' ? '' : '&board=' + boardKey);
          html += '<li><span style="min-width:70px;">' + esc(b.people[slug]) + '</span>' +
            '<input readonly value="' + esc(url) + '" onclick="this.select()">' +
            '<button data-copy="' + esc(url) + '">Копирай</button></li>';
        });
      });
      list.innerHTML = html;
      list.querySelectorAll('[data-copy]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          navigator.clipboard.writeText(btn.getAttribute('data-copy'));
          btn.textContent = 'Копирано ✓';
        });
      });
    }

    function renderBoardTabs() {
      const el = document.getElementById('boardTabs');
      el.innerHTML = Object.keys(boardsMeta).map(function (k) {
        return '<button class="board-tab' + (k === currentBoard ? ' active' : '') + '" data-board="' + esc(k) + '">' + esc(boardsMeta[k].label) + '</button>';
      }).join('');
      el.querySelectorAll('[data-board]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          currentBoard = btn.getAttribute('data-board');
          sessionStorage.setItem('board', currentBoard);
          editingId = null;
          openComments.clear();
          renderBoardTabs();
          document.getElementById('newTaskWho').innerHTML = peopleOptions();
          refresh();
        });
      });
    }

    async function init() {
      document.getElementById('todayLabel').textContent = new Date().toLocaleDateString('bg-BG');
      try {
        const meta = await apiGet('meta');
        if (meta.ok === false) { onError({ message: meta.error }); return; }
        boardsMeta = meta.boards || {};
      } catch (err) { onError(err); return; }
      if (!boardsMeta[currentBoard]) currentBoard = 'main';
      renderBoardTabs();
      document.getElementById('newTaskWho').innerHTML = peopleOptions();
      document.getElementById('addBtn').addEventListener('click', addTask);
      buildLinks();
      refresh();
    }

    init();
  </script>
</body>
</html>
