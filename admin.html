<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Основен панел</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div class="topbar">
    <img class="site-logo" src="logo.svg" alt="" onerror="this.style.display='none'">
    <span class="topbar-title">Табло • Задачи</span>
    <span id="todayLabel"></span>
  </div>
  <div class="wrap">
    <div class="tabs">
      <button type="button" class="tab-btn active" id="tabDashboard">Табло</button>
      <button type="button" class="tab-btn" id="tabProjects">Проекти</button>
      <button type="button" class="tab-btn" id="tabCalendar">Календар</button>
    </div>
    <div id="dashboardView">
      <div class="card">
        <h2>Нова задача</h2>
        <div class="addrow">
          <input type="text" id="newTaskText" placeholder="Описание на задачата...">
          <select id="newTaskWho"></select>
          <select id="newTaskProject"></select>
          <label class="date-field">От <input type="date" id="newTaskStart"></label>
          <label class="date-field">До <input type="date" id="newTaskEnd"></label>
          <label class="important-check"><input type="checkbox" id="newTaskImportant"> Важна</label>
          <button class="btn-primary" id="addBtn">Добави</button>
        </div>
        <p class="sub-note" style="padding-top:0;">Трябва да избереш поне начална или крайна дата.</p>
      </div>
      <div class="card important-card" id="importantCard"></div>
      <div class="card pending-card" id="approvalCard"></div>
      <div class="card" id="activeCard"></div>
      <div class="card" id="doneCard"></div>
      <div class="card">
        <h2 class="collapsible-header collapsed" id="linksToggle">Лични линкове<span class="collapse-arrow">▾</span></h2>
        <ul class="links" id="linksList" style="display:none;"></ul>
      </div>
    </div>
    <div id="projectsView" style="display:none;">
      <div class="card">
        <h2>Проекти</h2>
        <div class="project-picker">
          <select id="projectSelect"></select>
          <select id="projectSort">
            <option value="activity">Подреди по активност</option>
            <option value="assignee">Подреди по изпълнител</option>
            <option value="status">Подреди по статус</option>
          </select>
        </div>
        <div id="projectTaskList"><div class="empty">Избери проект отгоре, за да видиш задачите му.</div></div>
      </div>
    </div>
    <div id="calendarView" style="display:none;">
      <div class="card">
        <h2>Календар</h2>
        <div class="calendar-nav">
          <button type="button" class="btn-ghost" id="calPrev">‹ Предишен</button>
          <span class="calendar-label" id="calLabel"></span>
          <button type="button" class="btn-ghost" id="calNext">Следващ ›</button>
        </div>
        <div id="calendarGrid" class="calendar-grid-wrap"></div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const NAME_MAP = {
      geri:  'Гери', zori:  'Зори', zara:  'Зара', tedi:  'Теди',
      lacho: 'Лъчо', drago: 'Драго', ivo:   'Иво',  todor: 'Тодор'
    };

    const PROJECTS = [
      'Холидей парк, гр. Русе',
      'Дом за възрастни хора, гр. Момин проход',
      'Холидей парк, Симеоново',
      'Алмакс',
      'Биотрейд',
      'Белисимо',
      'Ресторант Шамот',
      'Здравко Здравков',
      'Технополис, гр. Монтана',
      'Младен, с. Лозен'
    ];

    const pin = sessionStorage.getItem('pin');
    if (!pin) { location.href = 'index.html'; }

    let data = [];
    let lastSnapshot = null;
    let editingId = null;
    let editingCommentId = null;
    let selectedProject = '';
    let projectSort = 'activity';
    let calYear = (new Date()).getFullYear();
    let calMonth = (new Date()).getMonth();
    const openComments = new Set();
    const commentDrafts = {};

    // Две отделни нива на "прочетено": ниво коментар (всеки коментар поотделно,
    // маркира се само като се кликне direktно върху него) и ниво задача (само
    // "новото" на самата задача — маха се щом отвориш панела ѝ, но се връща
    // автоматично щом дойде нов/редактиран коментар, защото се пази заедно с
    // "отпечатък" на текущите коментари, а не просто дали някога е бил отварян).
    const SEEN_COMMENTS_KEY = 'seenComments_admin';
    const SEEN_TASKS_KEY = 'seenTasks_admin';
    let seenComments, seenTasks;
    try { seenComments = new Set(JSON.parse(localStorage.getItem(SEEN_COMMENTS_KEY) || '[]')); }
    catch (e) { seenComments = new Set(); }
    try { seenTasks = JSON.parse(localStorage.getItem(SEEN_TASKS_KEY) || '{}'); }
    catch (e) { seenTasks = {}; }
    function saveSeenComments() { localStorage.setItem(SEEN_COMMENTS_KEY, JSON.stringify(Array.from(seenComments))); }
    function saveSeenTasks() { localStorage.setItem(SEEN_TASKS_KEY, JSON.stringify(seenTasks)); }
    function isUnread(c) { return c.author !== 'Админ' && !seenComments.has(c.id); }
    function taskSignature(t) { return (t.comments || []).map(function (c) { return c.id + ':' + c.date; }).join('|'); }
    function isTaskUnread(t) {
      const neverOpened = !(t.id in seenTasks);
      const hasNewComments = (t.comments || []).some(isUnread) && seenTasks[t.id] !== taskSignature(t);
      return neverOpened || hasNewComments;
    }
    function markTaskOpened(t) {
      seenTasks[t.id] = taskSignature(t);
      saveSeenTasks();
    }
    function markCommentSeen(id) {
      seenComments.add(id);
      saveSeenComments();
    }

    // "Лайк" на коментар — пази се в листа "Коментари" (колона "Харесано от"),
    // за да го вижда и другата страна (админ вижда че личен потребител е
    // харесал негов коментар, и обратно). Никога не пипа датата на коментара,
    // затова не влияе на подредбата по активност.
    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // Apps Script понякога не отговаря навреме (бавен round-trip, timeout,
    // или табът е бил минимизиран докато е чакал) и вместо JSON връща HTML
    // грешка — това чупи res.json(). При такъв провал (или чиста мрежова
    // грешка) опитваме автоматично още 2 пъти, с кратко изчакване между
    // опитите, преди да предадем грешката нагоре към извикващия.
    async function fetchJsonWithRetry(url, options, attempts) {
      attempts = attempts || 3;
      let lastErr;
      for (let i = 0; i < attempts; i++) {
        try {
          const res = await fetch(url, options);
          return await res.json();
        } catch (err) {
          lastErr = err;
          if (i < attempts - 1) {
            await new Promise(function (resolve) { setTimeout(resolve, 1500 * (i + 1)); });
          }
        }
      }
      throw lastErr;
    }

    async function apiGet(action, extraParams) {
      const params = new URLSearchParams(Object.assign({ action: action, pin: pin }, extraParams || {}));
      return fetchJsonWithRetry(API_URL + '?' + params.toString());
    }

    // ВАЖНО: без header "Content-Type: application/json" — иначе браузърът
    // праща CORS preflight (OPTIONS), който Apps Script не поддържа.
    async function apiPost(action, extra) {
      return fetchJsonWithRetry(API_URL, {
        method: 'POST',
        body: JSON.stringify(Object.assign({ action: action, pin: pin }, extra || {}))
      });
    }

    function onError(err) {
      console.error('Server error:', err);
      alert('Грешка от сървъра: ' + (err && err.message ? err.message : err));
    }

    function peopleOptions(selected) {
      return Object.values(NAME_MAP).map(function (n) {
        return '<option value="' + esc(n) + '"' + (n === selected ? ' selected' : '') + '>' + esc(n) + '</option>';
      }).join('');
    }

    function projectOptions(selected) {
      return '<option value="">— без проект —</option>' + PROJECTS.map(function (p) {
        return '<option value="' + esc(p) + '"' + (p === selected ? ' selected' : '') + '>' + esc(p) + '</option>';
      }).join('');
    }

    function projectBadge(t) {
      return t.project ? '<span class="badge-project">' + esc(t.project) + '</span>' : '';
    }

    function formatDisplayDate(iso) {
      const parts = iso.split('-');
      return parts[2] + '.' + parts[1] + '.' + parts[0];
    }

    function dateBadge(t) {
      if (t.startDate && t.endDate) {
        return '<span class="badge-date">' + esc(formatDisplayDate(t.startDate)) + ' – ' + esc(formatDisplayDate(t.endDate)) + '</span>';
      }
      if (t.startDate) {
        return '<span class="badge-date">' + esc(formatDisplayDate(t.startDate)) + '</span>';
      }
      if (t.endDate) {
        return '<span class="badge-date badge-date-deadline">Да се изпълни до: ' + esc(formatDisplayDate(t.endDate)) + '</span>';
      }
      return '';
    }

    function commentsHtml(t) {
      const open = openComments.has(t.id);
      const list = (t.comments || []).map(function (c) {
        const unread = isUnread(c);
        const cls = 'comment ' + (c.author === 'Админ' ? 'comment-admin' : 'comment-person') + (unread ? ' comment-unread' : '');
        const body = c.id === editingCommentId
          ? '<div class="comment-edit-row"><input type="text" class="comment-edit-text" value="' + esc(c.text) + '">' +
            '<button class="btn-primary comment-edit-save" data-comment="' + esc(c.id) + '">Запази</button>' +
            '<button class="btn-ghost comment-edit-cancel" data-comment="' + esc(c.id) + '">Отказ</button></div>'
          : '<div class="comment-text"><span class="comment-text-value">' + esc(c.text) +
              ' ' + commentLikeBtnHtml(c) + '</span>' +
            '<div class="comment-actions">' +
              '<button class="comment-edit-btn" data-comment="' + esc(c.id) + '" title="Редактирай">✎</button>' +
              '<button class="comment-delete-btn" data-comment="' + esc(c.id) + '" title="Изтрий">🗑</button>' +
            '</div></div>';
        return '<div class="' + cls + '" data-comment-id="' + esc(c.id) + '" title="' + (unread ? 'Кликни за прочетено' : '') + '">' +
          '<b>' + esc(c.author) + '</b><span class="comment-date">' + esc(c.date) + '</span>' +
          (unread ? '<span class="comment-unread-badge">Ново</span>' : '') + body + '</div>';
      }).join('');
      const draft = commentDrafts[t.id] || '';
      return '<div class="comments" id="comments-' + esc(t.id) + '" style="display:' + (open ? 'block' : 'none') + '">' +
        '<div class="comment-list">' + (list || '<div class="comment-empty">Няма коментари.</div>') + '</div>' +
        '<div class="comment-add">' +
          '<input type="text" class="comment-input" data-task="' + esc(t.id) + '" placeholder="Коментар..." value="' + esc(draft) + '">' +
          '<button class="btn-ghost comment-send" data-task="' + esc(t.id) + '">Изпрати</button>' +
        '</div>' +
      '</div>';
    }

    function commentToggleBtn(t) {
      const n = (t.comments || []).length;
      const unread = (t.comments || []).some(isUnread);
      return '<button class="btn-ghost comment-toggle' + (unread ? ' comment-toggle-unread' : '') + '" data-toggle="' + esc(t.id) + '">💬 ' + n + '</button>';
    }

    function commentLikeBtnHtml(c) {
      const likedBy = c.likedBy || [];
      const count = likedBy.length;
      const mine = likedBy.indexOf('Админ') !== -1;
      const cls = mine ? ' comment-like-mine' : (count > 0 ? ' comment-like-has' : '');
      return '<button class="comment-like-btn' + cls + '" data-comment-like="' + esc(c.id) + '" title="' + (mine ? 'Махни харесване' : 'Хареса') + '">👍' + (count > 0 ? ' ' + count : '') + '</button>';
    }

    // fullCheck=true (само "Чакат одобрение"): удебелява и чисто нова задача
    // без нито един коментар — админът трябва да забележи нови предложения.
    // fullCheck=false/липсва (Активни/Изпълнени): удебелява само ако има
    // непрочетен коментар — безсмислено е задача, добавена от самия админ,
    // да излиза "нова" за него.
    function taskTextHtml(t, extraCls, fullCheck) {
      const unread = fullCheck ? isTaskUnread(t) : (t.comments || []).some(isUnread);
      const cls = 'task-text' + (extraCls ? ' ' + extraCls : '') + (unread ? ' task-text-unread' : '');
      return '<span class="' + cls + '">' + (unread ? '<span class="unread-dot"></span>' : '') + esc(t.text) + '</span>';
    }

    // Само за "Чакат одобрение" — маркира самата задача като видяна, без да
    // се налага да отваряш (евентуално празния) панел с коментари за да го направиш.
    function markReadBtnHtml(t) {
      if (!isTaskUnread(t)) return '';
      return '<button class="btn-ghost mark-read-btn" data-mark-read="' + esc(t.id) + '" title="Маркирай задачата като прочетена">✓ Прочетено</button>';
    }

    function editRowHtml(t) {
      return '<div class="edit-row">' +
        '<input type="text" class="edit-text" value="' + esc(t.text) + '">' +
        '<select class="edit-assignee">' + peopleOptions(t.assignee) + '</select>' +
        '<select class="edit-project">' + projectOptions(t.project) + '</select>' +
        '<label class="date-field">От <input type="date" class="edit-start" value="' + esc(t.startDate || '') + '"></label>' +
        '<label class="date-field">До <input type="date" class="edit-end" value="' + esc(t.endDate || '') + '"></label>' +
        '<label class="important-check"><input type="checkbox" class="edit-important"' + (t.important ? ' checked' : '') + '> Важна</label>' +
        '<label class="important-check"><input type="checkbox" class="edit-in-calendar"' + (t.inCalendar ? ' checked' : '') + '> Календар</label>' +
        '<button class="btn-primary edit-save" data-id="' + esc(t.id) + '">Запази</button>' +
        '<button class="btn-ghost edit-cancel" data-id="' + esc(t.id) + '">Отказ</button>' +
      '</div>';
    }

    function importantBadge() {
      return '<span class="badge-important">Важна</span>';
    }

    function groupByAssignee(rows) {
      const order = [], map = {};
      rows.forEach(function (t) { if (!(t.assignee in map)) { map[t.assignee] = []; order.push(t.assignee); } map[t.assignee].push(t); });
      return { order: order, map: map };
    }

    function renderImportant() {
      const important = data.filter(function (t) { return t.status === 'Активна' && t.important; });
      let html = '<h2>Важни задачи (' + important.length + ')</h2>';
      if (important.length) {
        const g = groupByAssignee(important);
        g.order.forEach(function (name) {
          html += '<div class="group-name">' + esc(name) + ' (' + g.map[name].length + ')</div><ul class="tasks">';
          g.map[name].forEach(function (t) {
            const row = t.id === editingId ? editRowHtml(t) :
              '<input type="checkbox" class="chk" data-id="' + esc(t.id) + '">' +
              importantBadge() +
              projectBadge(t) +
              dateBadge(t) +
              taskTextHtml(t) +
              commentToggleBtn(t) +
              '<button class="btn-ghost" data-edit="' + esc(t.id) + '">✎</button>' +
              '<button class="btn-ghost" data-del="' + esc(t.id) + '">✕</button>';
            html += '<li class="important-row" data-id="' + esc(t.id) + '"><div class="task-row">' + row + '</div>' + commentsHtml(t) + '</li>';
          });
          html += '</ul>';
        });
      } else {
        html += '<div class="empty">Няма важни задачи в момента.</div>';
      }
      document.getElementById('importantCard').innerHTML = html;
    }

    function renderApproval() {
      const pending = data.filter(function (t) { return t.status === 'Чака одобрение'; });
      let html = '<h2>Чакат одобрение (' + pending.length + ')</h2>';
      if (pending.length) {
        const g = groupByAssignee(pending);
        g.order.forEach(function (name) {
          html += '<div class="group-name">' + esc(name) + ' (' + g.map[name].length + ')</div><ul class="tasks">';
          g.map[name].forEach(function (t) {
            html += '<li class="' + (t.important ? 'important-row' : '') + '" data-id="' + esc(t.id) + '"><div class="task-row">' +
              '<span class="badge-pending">Чака</span>' +
              (t.important ? importantBadge() : '') +
              projectBadge(t) +
              dateBadge(t) +
              taskTextHtml(t, null, true) +
              markReadBtnHtml(t) +
              commentToggleBtn(t) +
              '<button class="btn-primary" data-approve="' + esc(t.id) + '">Одобри</button>' +
              '<button class="btn-ghost" data-del="' + esc(t.id) + '">Отхвърли</button>' +
              '</div>' + commentsHtml(t) + '</li>';
          });
          html += '</ul>';
        });
      } else {
        html += '<div class="empty">Няма предложени задачи, чакащи одобрение.</div>';
      }
      document.getElementById('approvalCard').innerHTML = html;
    }

    function renderActive() {
      const active = data.filter(function (t) { return t.status === 'Активна' && !t.important; });
      let html = '<h2>Активни задачи (' + active.length + ')</h2>';
      if (active.length) {
        const g = groupByAssignee(active);
        g.order.forEach(function (name) {
          html += '<div class="group-name">' + esc(name) + ' (' + g.map[name].length + ')</div><ul class="tasks">';
          g.map[name].forEach(function (t) {
            const row = t.id === editingId ? editRowHtml(t) :
              '<input type="checkbox" class="chk" data-id="' + esc(t.id) + '">' +
              projectBadge(t) +
              dateBadge(t) +
              taskTextHtml(t) +
              commentToggleBtn(t) +
              '<button class="btn-ghost" data-edit="' + esc(t.id) + '">✎</button>' +
              '<button class="btn-ghost" data-del="' + esc(t.id) + '">✕</button>';
            html += '<li data-id="' + esc(t.id) + '"><div class="task-row">' + row + '</div>' + commentsHtml(t) + '</li>';
          });
          html += '</ul>';
        });
      } else {
        html += '<div class="empty">Няма активни задачи.</div>';
      }
      document.getElementById('activeCard').innerHTML = html;
    }

    function renderDone() {
      const done = data.filter(function (t) { return t.status === 'Изпълнена'; });
      let html = '<h2>Изпълнени днес (' + done.length + ')</h2>';
      if (done.length) {
        html += '<ul class="tasks">' + done.map(function (t) {
          return '<li data-id="' + esc(t.id) + '"><div class="task-row">' +
            '<input type="checkbox" class="chk" checked data-id="' + esc(t.id) + '">' +
            projectBadge(t) +
            dateBadge(t) +
            taskTextHtml(t, 'task-text-done') +
            '<span class="task-assignee">' + esc(t.assignee) + '</span>' +
            commentToggleBtn(t) +
            '</div>' + commentsHtml(t) + '</li>';
        }).join('') + '</ul>';
      } else {
        html += '<div class="empty">Все още няма изпълнени задачи.</div>';
      }
      html += '<div class="footer-row"><span class="count">Приключването премества изпълнените в Архив и ги маха от тук — активните остават за утре.</span>' +
        '<button class="btn-export" id="closeDayBtn" ' + (done.length ? '' : 'disabled') + '>Приключи деня</button></div>';
      document.getElementById('doneCard').innerHTML = html;
    }

    function sortProjectRows(rows, sortBy) {
      const copy = rows.slice();
      if (sortBy === 'assignee') {
        copy.sort(function (a, b) { return a.assignee.localeCompare(b.assignee, 'bg'); });
      } else if (sortBy === 'status') {
        const order = { 'Чака одобрение': 1, 'Активна': 2, 'Изпълнена': 3 };
        const tier = function (t) { return t.important ? 0 : (order[t.status] !== undefined ? order[t.status] : 4); };
        copy.sort(function (a, b) { return tier(a) - tier(b); });
      }
      // 'activity' (по подразбиране) — реда, в който сървърът вече ги връща (по последна активност)
      return copy;
    }

    const NO_PROJECT_VALUE = '__none__';

    function renderProjectsView() {
      const listEl = document.getElementById('projectTaskList');
      if (!selectedProject) {
        listEl.innerHTML = '<div class="empty">Избери проект отгоре, за да видиш задачите му.</div>';
        return;
      }
      let rows = selectedProject === NO_PROJECT_VALUE
        ? data.filter(function (t) { return !t.project; })
        : data.filter(function (t) { return t.project === selectedProject; });
      rows = sortProjectRows(rows, projectSort);
      if (!rows.length) {
        listEl.innerHTML = '<div class="empty">' + (selectedProject === NO_PROJECT_VALUE ? 'Няма задачи без проект.' : 'Няма задачи за този проект.') + '</div>';
        return;
      }
      const g = groupByAssignee(rows);
      let html = '';
      g.order.forEach(function (name) {
        html += '<div class="group-name">' + esc(name) + ' (' + g.map[name].length + ')</div><ul class="tasks">';
        g.map[name].forEach(function (t) {
          const isDone = t.status === 'Изпълнена';
          const isPending = t.status === 'Чака одобрение';
          const row = t.id === editingId ? editRowHtml(t) :
            (isPending
              ? '<span class="badge-pending">Чака</span>'
              : '<input type="checkbox" class="chk" ' + (isDone ? 'checked ' : '') + 'data-id="' + esc(t.id) + '">') +
            (t.important ? importantBadge() : '') +
            dateBadge(t) +
            taskTextHtml(t, isDone ? 'task-text-done' : null, isPending) +
            (isPending ? markReadBtnHtml(t) : '') +
            commentToggleBtn(t) +
            (isPending
              ? '<button class="btn-primary" data-approve="' + esc(t.id) + '">Одобри</button><button class="btn-ghost" data-del="' + esc(t.id) + '">Отхвърли</button>'
              : '<button class="btn-ghost" data-edit="' + esc(t.id) + '">✎</button><button class="btn-ghost" data-del="' + esc(t.id) + '">✕</button>');
          html += '<li class="' + (t.important ? 'important-row' : '') + '" data-id="' + esc(t.id) + '"><div class="task-row">' + row + '</div>' + commentsHtml(t) + '</li>';
        });
        html += '</ul>';
      });
      listEl.innerHTML = html;
    }

    const WEEKDAY_NAMES = ['Пон', 'Вт', 'Ср', 'Чет', 'Пет', 'Съб', 'Нед'];
    const MONTH_NAMES = ['Януари', 'Февруари', 'Март', 'Април', 'Май', 'Юни', 'Юли', 'Август', 'Септември', 'Октомври', 'Ноември', 'Декември'];

    // ISO 8601 номер на седмицата (понеделник е първи ден, седмица 1 е тази,
    // която съдържа първия четвъртък на годината).
    function isoWeekNumber(date) {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = (d.getUTCDay() + 6) % 7;
      d.setUTCDate(d.getUTCDate() - dayNum + 3);
      const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
      const firstDayNum = (firstThursday.getUTCDay() + 6) % 7;
      firstThursday.setUTCDate(firstThursday.getUTCDate() - firstDayNum + 3);
      return 1 + Math.round((d - firstThursday) / (7 * 24 * 3600 * 1000));
    }

    function dateKey(y, m, d) {
      return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    }

    // Задача с и начална, и крайна дата се показва във всеки ден от диапазона;
    // със само едната дата — само на нея.
    function tasksForDay(key) {
      // задачите се показват в календара само след изрично включване от админ
      // (чекбокс "Календар" при редакция) — датите сами по себе си не са достатъчни
      return data.filter(function (t) {
        if (!t.inCalendar) return false;
        if (t.startDate && t.endDate) return key >= t.startDate && key <= t.endDate;
        if (t.startDate) return key === t.startDate;
        if (t.endDate) return key === t.endDate;
        return false;
      });
    }

    function renderCalendar() {
      const label = document.getElementById('calLabel');
      if (label) label.textContent = MONTH_NAMES[calMonth] + ' ' + calYear;
      const grid = document.getElementById('calendarGrid');
      if (!grid) return;

      const firstOfMonth = new Date(calYear, calMonth, 1);
      const startOffset = (firstOfMonth.getDay() + 6) % 7; // понеделник = 0
      const gridStart = new Date(calYear, calMonth, 1 - startOffset);
      const today = new Date();
      const todayKey = dateKey(today.getFullYear(), today.getMonth(), today.getDate());

      let html = '<div class="calendar-row calendar-weekdays"><div class="calendar-week-label"></div>' +
        WEEKDAY_NAMES.map(function (n) { return '<div class="calendar-weekday">' + n + '</div>'; }).join('') +
        '</div>';

      for (let w = 0; w < 6; w++) {
        const weekFirstDate = new Date(gridStart);
        weekFirstDate.setDate(gridStart.getDate() + w * 7);
        const weekNum = isoWeekNumber(weekFirstDate);
        html += '<div class="calendar-row"><div class="calendar-week-label" title="Седмица">' + weekNum + '</div>';
        for (let d = 0; d < 7; d++) {
          const cellDate = new Date(gridStart);
          cellDate.setDate(gridStart.getDate() + w * 7 + d);
          const key = dateKey(cellDate.getFullYear(), cellDate.getMonth(), cellDate.getDate());
          const inMonth = cellDate.getMonth() === calMonth;
          const isToday = key === todayKey;
          const dayTasks = tasksForDay(key);
          html += '<div class="calendar-cell' + (inMonth ? '' : ' calendar-cell-out') + (isToday ? ' calendar-cell-today' : '') + '">' +
            '<div class="calendar-daynum">' + cellDate.getDate() + '</div>' +
            '<div class="calendar-tasks">' + dayTasks.map(function (t) {
              // краен ден (независимо дали има и начална дата) — оцветява се в червено
              const isDeadline = !!(t.endDate && key === t.endDate);
              return '<div class="calendar-task' + (isDeadline ? ' calendar-task-deadline' : '') + '" title="' + esc(t.text) + '">' + esc(t.text) + '</div>';
            }).join('') + '</div>' +
          '</div>';
        }
        html += '</div>';
      }
      grid.innerHTML = html;
    }

    function attachHandlers() {
      document.querySelectorAll('.chk').forEach(function (cb) {
        cb.addEventListener('change', function () { toggle(cb.getAttribute('data-id'), cb.checked); });
      });
      document.querySelectorAll('[data-del]').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          const original = btn.textContent;
          const isReject = original === 'Отхвърли';
          const id = btn.getAttribute('data-del');
          btn.disabled = true;
          if (isReject) btn.textContent = 'Отхвърля се...';
          await del(id);
          if (document.body.contains(btn)) {
            btn.disabled = false;
            btn.textContent = original;
          }
        });
      });
      document.querySelectorAll('[data-approve]').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          const id = btn.getAttribute('data-approve');
          btn.disabled = true;
          btn.textContent = 'Одобрява се...';
          await approve(id);
          if (document.body.contains(btn)) {
            btn.disabled = false;
            btn.textContent = 'Одобри';
          }
        });
      });
      document.querySelectorAll('[data-edit]').forEach(function (btn) {
        btn.addEventListener('click', function () { editingId = btn.getAttribute('data-edit'); render(); });
      });
      document.querySelectorAll('.edit-cancel').forEach(function (btn) {
        btn.addEventListener('click', function () { editingId = null; render(); });
      });
      document.querySelectorAll('.edit-save').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          const li = btn.closest('li');
          const textInput = li.querySelector('.edit-text');
          const assigneeSelect = li.querySelector('.edit-assignee');
          const projectSelect = li.querySelector('.edit-project');
          const startInput = li.querySelector('.edit-start');
          const endInput = li.querySelector('.edit-end');
          const importantCb = li.querySelector('.edit-important');
          const inCalendarCb = li.querySelector('.edit-in-calendar');
          const text = textInput.value.trim();
          const assignee = assigneeSelect.value;
          const project = projectSelect.value;
          const startDate = startInput.value;
          const endDate = endInput.value;
          if (!text) return;
          btn.disabled = true;
          btn.textContent = 'Запазва се...';
          textInput.disabled = true;
          assigneeSelect.disabled = true;
          projectSelect.disabled = true;
          startInput.disabled = true;
          endInput.disabled = true;
          importantCb.disabled = true;
          inCalendarCb.disabled = true;
          await editTask(btn.getAttribute('data-id'), text, assignee, importantCb.checked, project, startDate, endDate, inCalendarCb.checked);
          if (document.body.contains(btn)) {
            btn.disabled = false;
            btn.textContent = 'Запази';
            textInput.disabled = false;
            assigneeSelect.disabled = false;
            projectSelect.disabled = false;
            startInput.disabled = false;
            endInput.disabled = false;
            importantCb.disabled = false;
            inCalendarCb.disabled = false;
          }
        });
      });
      document.querySelectorAll('[data-toggle]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const id = btn.getAttribute('data-toggle');
          if (openComments.has(id)) {
            openComments.delete(id);
          } else {
            openComments.add(id);
            const t = data.find(function (x) { return x.id === id; });
            if (t) markTaskOpened(t);
          }
          render();
        });
      });
      document.querySelectorAll('[data-mark-read]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const id = btn.getAttribute('data-mark-read');
          const t = data.find(function (x) { return x.id === id; });
          if (t) markTaskOpened(t);
          render();
        });
      });
      document.querySelectorAll('.comment[data-comment-id]').forEach(function (el) {
        el.addEventListener('click', function (e) {
          if (e.target.closest('button, input')) return;
          markCommentSeen(el.getAttribute('data-comment-id'));
          render();
        });
      });
      document.querySelectorAll('[data-comment-like]').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          btn.disabled = true;
          await toggleCommentLike(btn.getAttribute('data-comment-like'));
        });
      });
      document.querySelectorAll('.comment-input').forEach(function (input) {
        input.addEventListener('input', function () {
          commentDrafts[input.getAttribute('data-task')] = input.value;
        });
      });
      document.querySelectorAll('.comment-send').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          const id = btn.getAttribute('data-task');
          const input = document.querySelector('.comment-input[data-task="' + CSS.escape(id) + '"]');
          const text = input.value.trim();
          if (!text) return;
          btn.disabled = true;
          btn.textContent = 'Изпраща се...';
          input.disabled = true;
          await addComment(id, text);
          // при успех render() вече е заместил този бутон с нов; при грешка го връщаме в нормално състояние
          if (document.body.contains(btn)) {
            btn.disabled = false;
            btn.textContent = 'Изпрати';
            input.disabled = false;
          }
        });
      });
      document.querySelectorAll('.comment-edit-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          editingCommentId = btn.getAttribute('data-comment');
          markCommentSeen(editingCommentId);
          render();
        });
      });
      document.querySelectorAll('.comment-edit-cancel').forEach(function (btn) {
        btn.addEventListener('click', function () { editingCommentId = null; render(); });
      });
      document.querySelectorAll('.comment-edit-save').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          const wrap = btn.closest('.comment-edit-row');
          const input = wrap.querySelector('.comment-edit-text');
          const text = input.value.trim();
          if (!text) return;
          btn.disabled = true;
          btn.textContent = 'Запазва се...';
          input.disabled = true;
          await editComment(btn.getAttribute('data-comment'), text);
          if (document.body.contains(btn)) {
            btn.disabled = false;
            btn.textContent = 'Запази';
            input.disabled = false;
          }
        });
      });
      document.querySelectorAll('.comment-delete-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!confirm('Да изтрия ли този коментар?')) return;
          deleteComment(btn.getAttribute('data-comment'));
        });
      });
      const closeBtn = document.getElementById('closeDayBtn');
      if (closeBtn) closeBtn.addEventListener('click', closeDay);
    }

    // Прилага нов отговор от сървъра и опреснява екрана. Използвай това
    // (вместо direktно "data = res.tasks; render();") при всяко действие,
    // за да остане "тихият" refresh() в синхрон и да не решава погрешно,
    // че нещо ново се е случило.
    function applyData(res) {
      data = res.tasks || [];
      lastSnapshot = JSON.stringify(data);
      render();
    }

    function render() {
      if (!Array.isArray(data)) {
        document.getElementById('importantCard').innerHTML = '';
        document.getElementById('approvalCard').innerHTML = '';
        document.getElementById('activeCard').innerHTML = '<h2>Активни задачи</h2><div class="empty">Няма данни (виж конзолата за грешка).</div>';
        document.getElementById('doneCard').innerHTML = '';
        return;
      }
      renderImportant();
      renderApproval();
      renderActive();
      renderDone();
      renderProjectsView();
      renderCalendar();
      attachHandlers();
    }

    async function refresh() {
      try {
        const res = await apiGet('tasks');
        if (res.ok === false) { onError({ message: res.error }); return; }
        const snapshot = JSON.stringify(res.tasks || []);
        if (snapshot === lastSnapshot) return; // нищо ново — не пипаме екрана (за да не скача курсорът в коментар/поле)
        applyData(res);
      } catch (err) { onError(err); }
    }

    async function addTask() {
      const text = document.getElementById('newTaskText').value.trim();
      const who = document.getElementById('newTaskWho').value;
      const project = document.getElementById('newTaskProject').value;
      const startDate = document.getElementById('newTaskStart').value;
      const endDate = document.getElementById('newTaskEnd').value;
      const important = document.getElementById('newTaskImportant').checked;
      if (!text) return;
      if (!startDate && !endDate) { alert('Избери поне начална или крайна дата.'); return; }
      try {
        const res = await apiPost('addTask', { text: text, assignee: who, important: important, project: project, startDate: startDate, endDate: endDate });
        if (res.ok === false) { onError({ message: res.error }); return; }
        const created = (res.tasks || []).find(function (t) { return t.text === text && t.assignee === who; });
        if (created) markTaskOpened(created);
        applyData(res);
        document.getElementById('newTaskText').value = '';
        document.getElementById('newTaskImportant').checked = false;
        document.getElementById('newTaskProject').value = '';
        document.getElementById('newTaskStart').value = '';
        document.getElementById('newTaskEnd').value = '';
      } catch (err) { onError(err); }
    }

    async function editTask(id, text, assignee, important, project, startDate, endDate, inCalendar) {
      try {
        const res = await apiPost('editTask', { id: id, text: text, assignee: assignee, important: important, project: project, startDate: startDate, endDate: endDate, inCalendar: inCalendar });
        if (res.ok === false) { onError({ message: res.error }); return; }
        editingId = null;
        applyData(res);
      } catch (err) { onError(err); }
    }

    async function approve(id) {
      try {
        const res = await apiPost('approveTask', { id: id });
        if (res.ok === false) { onError({ message: res.error }); return; }
        const approved = (res.tasks || []).find(function (t) { return t.id === id; });
        if (approved) markTaskOpened(approved);
        applyData(res);
      } catch (err) { onError(err); }
    }

    async function toggle(id, checked) {
      try {
        const res = await apiPost('toggleTask', { id: id, done: checked });
        if (res.ok === false) { onError({ message: res.error }); return; }
        applyData(res);
      } catch (err) { onError(err); }
    }

    async function del(id) {
      if (!confirm('Да изтрия ли тази задача?')) return;
      try {
        const res = await apiPost('deleteTask', { id: id });
        if (res.ok === false) { onError({ message: res.error }); return; }
        applyData(res);
      } catch (err) { onError(err); }
    }

    async function addComment(taskId, text) {
      try {
        const res = await apiPost('addComment', { taskId: taskId, text: text });
        if (res.ok === false) { onError({ message: res.error }); return; }
        delete commentDrafts[taskId];
        openComments.add(taskId);
        applyData(res);
      } catch (err) { onError(err); }
    }

    async function editComment(commentId, text) {
      try {
        const res = await apiPost('editComment', { commentId: commentId, text: text });
        if (res.ok === false) { onError({ message: res.error }); return; }
        editingCommentId = null;
        applyData(res);
      } catch (err) { onError(err); }
    }

    async function toggleCommentLike(commentId) {
      try {
        const res = await apiPost('toggleCommentLike', { commentId: commentId });
        if (res.ok === false) { onError({ message: res.error }); return; }
        markCommentSeen(commentId);
        applyData(res);
      } catch (err) { onError(err); }
    }

    async function deleteComment(commentId) {
      try {
        const res = await apiPost('deleteComment', { commentId: commentId });
        if (res.ok === false) { onError({ message: res.error }); return; }
        applyData(res);
      } catch (err) { onError(err); }
    }

    async function closeDay() {
      if (!confirm('Изпълнените задачи ще се преместят в Архив и ще изчезнат от активния списък. Продължи?')) return;
      try {
        const res = await apiPost('closeDay', {});
        if (res.ok === false) { onError({ message: res.error }); return; }
        applyData(res);
      } catch (err) { onError(err); }
    }

    function buildLinks() {
      const base = location.origin + location.pathname.replace('admin.html', '');
      const list = document.getElementById('linksList');
      list.innerHTML = Object.keys(NAME_MAP).map(function (slug) {
        const url = base + 'person.html?u=' + slug;
        return '<li><b>' + esc(NAME_MAP[slug]) + '</b>' +
          '<input readonly value="' + esc(url) + '" onclick="this.select()">' +
          '<button data-copy="' + esc(url) + '">Копирай</button></li>';
      }).join('');
      list.querySelectorAll('[data-copy]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          navigator.clipboard.writeText(btn.getAttribute('data-copy'));
          btn.textContent = 'Копирано ✓';
        });
      });
    }

    // init
    document.getElementById('todayLabel').textContent = new Date().toLocaleDateString('bg-BG');
    document.getElementById('newTaskWho').innerHTML = peopleOptions();
    document.getElementById('newTaskProject').innerHTML = projectOptions();
    document.getElementById('addBtn').addEventListener('click', async function () {
      const btn = document.getElementById('addBtn');
      const input = document.getElementById('newTaskText');
      const importantCb = document.getElementById('newTaskImportant');
      const projectSelect = document.getElementById('newTaskProject');
      const startInput = document.getElementById('newTaskStart');
      const endInput = document.getElementById('newTaskEnd');
      btn.disabled = true;
      btn.textContent = 'Добавя се...';
      input.disabled = true;
      importantCb.disabled = true;
      projectSelect.disabled = true;
      startInput.disabled = true;
      endInput.disabled = true;
      await addTask();
      btn.disabled = false;
      btn.textContent = 'Добави';
      input.disabled = false;
      importantCb.disabled = false;
      projectSelect.disabled = false;
      startInput.disabled = false;
      endInput.disabled = false;
    });
    buildLinks();
    document.getElementById('linksToggle').addEventListener('click', function () {
      const collapsed = this.classList.toggle('collapsed');
      document.getElementById('linksList').style.display = collapsed ? 'none' : '';
    });

    const tabs = [
      { btn: document.getElementById('tabDashboard'), view: document.getElementById('dashboardView') },
      { btn: document.getElementById('tabProjects'), view: document.getElementById('projectsView') },
      { btn: document.getElementById('tabCalendar'), view: document.getElementById('calendarView') }
    ];
    tabs.forEach(function (tab) {
      tab.btn.addEventListener('click', function () {
        tabs.forEach(function (other) {
          other.btn.classList.toggle('active', other === tab);
          other.view.style.display = other === tab ? '' : 'none';
        });
      });
    });
    document.getElementById('projectSelect').innerHTML = '<option value="">— избери проект —</option>' +
      '<option value="' + NO_PROJECT_VALUE + '">— без проект —</option>' +
      PROJECTS.map(function (p) { return '<option value="' + esc(p) + '">' + esc(p) + '</option>'; }).join('');
    document.getElementById('projectSelect').addEventListener('change', function () {
      selectedProject = this.value;
      renderProjectsView();
      attachHandlers();
    });
    document.getElementById('projectSort').addEventListener('change', function () {
      projectSort = this.value;
      renderProjectsView();
      attachHandlers();
    });
    document.getElementById('calPrev').addEventListener('click', function () {
      calMonth--;
      if (calMonth < 0) { calMonth = 11; calYear--; }
      renderCalendar();
    });
    document.getElementById('calNext').addEventListener('click', function () {
      calMonth++;
      if (calMonth > 11) { calMonth = 0; calYear++; }
      renderCalendar();
    });
    renderCalendar();

    refresh();

    // автоматично опресняване — не пипа задача/коментар, който в момента се редактира
    setInterval(function () { if (!editingId && !editingCommentId) refresh(); }, 15000);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && !editingId && !editingCommentId) refresh();
    });
  </script>
</body>
</html>
